apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'
apply from: '../../../app-versioning.gradle'

react {
    autolinkLibrariesWithApp()
}



def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def targetAbis = (project.findProperty("reactNativeArchitectures") ?: "armeabi-v7a,x86,arm64-v8a,x86_64").split(",")

project.ext.react = [
 hermesEnabled: true
]

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.dropa2z.rider"
    defaultConfig {
        applicationId "com.dropa2z.rider"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode project.ext.dropa2zVersionCode
        versionName project.ext.dropa2zVersionName
        multiDexEnabled true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
        signingConfig signingConfigs.debug
        minifyEnabled false
        shrinkResources false
        manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
    }

    splits {
        abi {
            reset()
            enable true
            universalApk true
            include(*targetAbis)
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
implementation "androidx.multidex:multidex:2.0.1"
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Production key/HTTPS configuration shared by both apps.
apply from: '../../../release-signing.gradle'
